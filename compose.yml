name: pong-ladder

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENABLE_HTTPS_HEADERS: ${APP_ENABLE_HTTPS_HEADERS:-false}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pong}:${POSTGRES_PASSWORD:-pong}@db:5432/${POSTGRES_DB:-pong_ladder}?schema=public
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Pong Ladder}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      APP_ENABLE_HTTPS_HEADERS: ${APP_ENABLE_HTTPS_HEADERS:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000)).then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pong-ladder

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pong_ladder}
      POSTGRES_USER: ${POSTGRES_USER:-pong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pong}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pong-ladder

volumes:
  postgres-data:

networks:
  pong-ladder:
    driver: bridge
