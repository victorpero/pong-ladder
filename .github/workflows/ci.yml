name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL service backs the database integration tests. It holds
    # no production data and never uses production credentials.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pong_ladder?schema=public
      RUN_DB_INTEGRATION_TESTS: "1"
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-invitation-handoff-secret-0123456789

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pong_ladder
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d pong_ladder"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build production application
        run: npm run build

      - name: Build production container image
        run: docker build --build-arg APP_ENABLE_HTTPS_HEADERS=true --tag pong-ladder:ci .
