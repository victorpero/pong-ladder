apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-ladder
  namespace: pingpong
  labels:
    app.kubernetes.io/name: pong-ladder
    app.kubernetes.io/part-of: pong-ladder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pong-ladder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pong-ladder
        app.kubernetes.io/part-of: pong-ladder
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-postgres
                  key: POSTGRES_USER
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: pong-ladder
          image: ghcr.io/victorpero/pong-ladder:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_APP_NAME
              value: Pong Ladder
            - name: APP_BASE_URL
              value: https://pongladder.com
            - name: EMAIL_DELIVERY_MODE
              value: smtp
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: APP_ENABLE_HTTPS_HEADERS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SESSION_SECRET
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: BETTER_AUTH_SECRET
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: GOOGLE_OAUTH_CLIENT_ID
                  optional: true
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: GOOGLE_OAUTH_CLIENT_SECRET
                  optional: true
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: EMAIL_FROM
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SMTP_PASSWORD
                  optional: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
