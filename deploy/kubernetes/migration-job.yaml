apiVersion: batch/v1
kind: Job
metadata:
  name: pong-ladder-migrate
  namespace: pingpong
  labels:
    app.kubernetes.io/name: pong-ladder
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: pong-ladder
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pong-ladder
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: pong-ladder
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ghcr.io/victorpero/pong-ladder:0.1.3
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-ladder-secrets
                  key: SESSION_SECRET
          command:
            - ./node_modules/.bin/prisma
            - migrate
            - deploy
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
